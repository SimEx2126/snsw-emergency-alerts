<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNSW Emergency Monitor — Initializing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/adventist-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem("snsw-monitor-theme");
if(t==="dark")document.documentElement.classList.add("dark");}catch(e){}})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:oklch(0.994 0.002 75);--surface:oklch(0.999 0.001 75);
  --text:oklch(0.215 0.006 75);--dim:oklch(0.505 0.008 75);
  --accent:#d2500a;--accent-text:oklch(0.545 0.170 40);
  --border:oklch(0.910 0.006 75);--divider:oklch(0.935 0.006 75);
  --track:oklch(0.955 0.005 75);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root.dark{
  --bg:oklch(0.185 0.006 75);--surface:oklch(0.225 0.007 75);
  --text:oklch(0.930 0.005 75);--dim:oklch(0.680 0.008 75);
  --accent:#e8703a;--accent-text:oklch(0.755 0.140 48);
  --border:oklch(0.325 0.007 75);--divider:oklch(0.285 0.007 75);
  --track:oklch(0.245 0.007 75);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}

.logo-ring{width:120px;height:120px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:var(--surface)}
.logo-ring img{width:64px;height:64px;object-fit:contain}
.logo-ring::before{content:'';position:absolute;inset:-8px;border:1px solid var(--border);border-radius:50%;border-top-color:var(--accent);animation:spin 2s linear infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-blink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.logo-text{font-size:18px;font-weight:700;letter-spacing:0.2em;color:var(--accent-text)}
.container{display:flex;flex-direction:column;align-items:center;gap:32px}

#bootLines{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:left;line-height:2;min-width:340px}
#bootLines .line{opacity:0;animation:fadein 0.3s ease forwards}
#bootLines .ok{color:var(--accent-text)}

#status{font-size:12px;font-weight:600;color:var(--text);letter-spacing:0.12em;margin-top:4px;min-height:20px;display:flex;align-items:center;gap:8px}
#status .blink{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse-blink 1.5s ease-in-out infinite;flex-shrink:0}

#countdown{font-family:var(--mono);margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:0.06em;text-align:center;min-height:16px}
#countdown .eta{color:var(--text)}
#countdown .bar-wrap{width:340px;height:3px;background:var(--track);border-radius:2px;margin-top:8px;overflow:hidden}
#countdown .bar-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width 1s linear}
</style>
</head>
<body>
<div class="container">
  <div class="logo-ring">
    <img src="/adventist-logo.png" alt="South NSW Conference">
  </div>

  <div id="bootLines"></div>

  <div id="status">
    <span class="blink"></span>
    <span id="statusText">COLLECTING DATA...</span>
  </div>

  <div id="countdown">
    <span id="etaText"></span>
    <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  </div>
</div>

<script>
const SWEEP_ESTIMATE_S = 50; // estimated sweep duration in seconds

const lines = [
  'SNSW EMERGENCY MONITOR',
  'INITIATING FIRST SWEEP...',
  '├── NSW RFS · MAJOR INCIDENTS',
  '├── BOM · NSW/ACT WEATHER WARNINGS',
  '├── GEOSCIENCE AUSTRALIA · EARTHQUAKES',
  '└── NASA FIRMS · GDELT NEWS LAYER',
  '<span class="ok">AWAITING SWEEP COMPLETION...</span>',
];

const container = document.getElementById('bootLines');
lines.forEach((text, i) => {
  setTimeout(() => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = text;
    container.appendChild(div);
  }, i * 220);
});

const statusMessages = [
  'COLLECTING DATA...',
  'PROCESSING SOURCES...',
  'SYNTHESIZING SIGNALS...',
  'CORRELATING FEEDS...',
  'AWAITING COMPLETION...',
];
let statusIdx = 0;
const statusText = document.getElementById('statusText');
setInterval(() => {
  statusIdx = (statusIdx + 1) % statusMessages.length;
  statusText.textContent = statusMessages[statusIdx];
}, 4000);

// === Countdown ===
const etaText = document.getElementById('etaText');
const barFill = document.getElementById('barFill');
let countdownInterval = null;

function startCountdown(elapsedSeconds) {
  let remaining = Math.max(0, SWEEP_ESTIMATE_S - elapsedSeconds);

  function tick() {
    if (remaining <= 0) {
      etaText.textContent = 'FINALIZING...';
      barFill.style.width = '99%';
      return;
    }
    const pct = Math.min(99, ((SWEEP_ESTIMATE_S - remaining) / SWEEP_ESTIMATE_S) * 100);
    barFill.style.width = pct + '%';
    etaText.innerHTML = `EST. READY IN <span class="eta">~${remaining}s</span>`;
    remaining--;
  }

  tick();
  countdownInterval = setInterval(tick, 1000);
}

// Fetch health to get elapsed time since sweep started
fetch('/api/health')
  .then(r => r.json())
  .then(h => {
    let elapsed = 0;
    if (h.sweepStartedAt) {
      elapsed = Math.floor((Date.now() - new Date(h.sweepStartedAt).getTime()) / 1000);
    }
    startCountdown(elapsed);
  })
  .catch(() => startCountdown(0));

// === SSE — wait for sweep to complete, then redirect ===
let redirected = false;
function goToDashboard() {
  if (redirected) return;
  redirected = true;
  clearInterval(countdownInterval);
  clearInterval(pollInterval);
  barFill.style.transition = 'width 0.4s ease';
  barFill.style.width = '100%';
  etaText.textContent = '';
  statusText.textContent = 'MONITOR READY — LOADING DASHBOARD';
  setTimeout(() => location.replace('/'), 800);
}

const es = new EventSource('/events');
es.onmessage = (e) => {
  try {
    const msg = JSON.parse(e.data);
    if (msg.type === 'update') {
      es.close();
      goToDashboard();
    }
  } catch {}
};
es.onerror = () => {
  es.close();
  setTimeout(() => location.reload(), 3000);
};

// === Fallback polling — in case SSE misses the update ===
const pollInterval = setInterval(() => {
  fetch('/api/data').then(r => {
    if (r.ok) goToDashboard();
  }).catch(() => {});
}, 5000);
</script>
</body>
</html>
